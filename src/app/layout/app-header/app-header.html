<a class="skip-link" href="#main">Skip to main content</a>

<header
  class="fixed inset-x-0 top-0 z-50 transition-[background-color,backdrop-filter,border-color] duration-300"
  [class.is-scrolled]="scrolled()"
>
  <div class="sf-gutter flex h-14 items-center gap-3 sm:h-16 sm:gap-6">
    <a
      routerLink="/"
      class="flex shrink-0 items-center gap-2"
      [attr.aria-label]="appName + ' home'"
      (click)="closeMenu()"
    >
      <svg viewBox="0 0 32 32" class="h-7 w-7" aria-hidden="true">
        <defs>
          <linearGradient id="sf-logo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff8b57" />
            <stop offset="100%" stop-color="#e8541a" />
          </linearGradient>
        </defs>
        <path fill="url(#sf-logo)" d="M17.6 2 6 18.2h7.2L11.4 30 26 12.6h-7.6L20.9 2z" />
      </svg>
      <span class="text-lg font-black tracking-tight">
        Stream<span class="text-ember-500">Forge</span>
      </span>
    </a>

    <nav class="hidden items-center gap-1 md:flex" aria-label="Primary">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="nav-link"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="ml-auto flex items-center gap-2">
      <span
        class="hidden items-center gap-1.5 rounded-full bg-ink-800/80 px-2.5 py-1 font-mono text-[0.6875rem] text-mist-400 ring-1 ring-white/8 sm:inline-flex"
      >
        <span class="h-1.5 w-1.5 rounded-full bg-ok-400"></span>
        Shaka Player
      </span>

      <button
        type="button"
        class="grid h-9 w-9 place-items-center rounded-full text-mist-200 transition hover:bg-white/10 md:hidden"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-nav"
        [attr.aria-label]="menuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <svg
            viewBox="0 0 24 24"
            class="h-5 w-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            class="h-5 w-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav
      id="mobile-nav"
      class="sf-glass sf-gutter border-x-0 border-b py-2 md:hidden"
      aria-label="Primary"
    >
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="nav-link block py-2.5 text-base"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  }
</header>
