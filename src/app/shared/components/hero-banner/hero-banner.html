<section class="hero relative isolate" aria-labelledby="hero-title">
  <!-- Backdrop -->
  <sf-poster-art
    class="absolute inset-0 -z-10 h-full w-full"
    [seed]="asset().id + '-hero'"
    [title]="asset().title"
    [src]="asset().poster"
  />

  <!-- Scrims: one vertical (into the rails below), one horizontal (behind copy) -->
  <div aria-hidden="true" class="scrim-v absolute inset-0 -z-10"></div>
  <div aria-hidden="true" class="scrim-h absolute inset-0 -z-10"></div>

  <div
    class="sf-gutter relative flex h-full max-w-3xl flex-col justify-end pb-10 sm:pb-14 lg:pb-20"
  >
    <div class="mb-3 flex flex-wrap items-center gap-2">
      @if (asset().isLive) {
        <span
          class="inline-flex items-center gap-1.5 rounded-md bg-live-500 px-2 py-1 text-[0.6875rem] font-bold tracking-wider text-white uppercase"
        >
          <span class="h-1.5 w-1.5 rounded-full bg-white"></span> Live now
        </span>
      }
      <sf-protocol-badge [protocol]="asset().type" />
      <span class="text-xs font-medium tracking-wide text-ember-400 uppercase">
        Featured on StreamForge
      </span>
    </div>

    <h1
      id="hero-title"
      class="text-4xl font-black tracking-tight text-mist-50 sm:text-5xl lg:text-6xl"
    >
      {{ asset().title }}
    </h1>

    <p class="mt-3 flex flex-wrap items-center gap-x-2 gap-y-1 text-sm text-mist-300">
      <span class="font-semibold text-ok-400">{{ asset().matchScore }}% match</span>
      @for (item of metaLine(); track item) {
        <span aria-hidden="true" class="text-mist-500">·</span>
        <span>{{ item }}</span>
      }
      <span aria-hidden="true" class="text-mist-500">·</span>
      <span>{{ asset().durationSeconds | duration }}</span>
    </p>

    <p class="mt-4 max-w-xl text-sm leading-relaxed text-mist-300 sm:text-base">
      {{ asset().synopsis }}
    </p>

    <div class="mt-6 flex flex-wrap items-center gap-3">
      <a
        [routerLink]="['/player', asset().id]"
        class="inline-flex items-center gap-2 rounded-lg bg-mist-50 px-5 py-2.5 text-sm font-semibold text-ink-950 transition hover:bg-white active:scale-[0.98]"
      >
        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor" aria-hidden="true">
          <path
            d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14Z"
          />
        </svg>
        Play
      </a>
      <a
        [routerLink]="['/video', asset().id]"
        class="inline-flex items-center gap-2 rounded-lg bg-mist-50/12 px-5 py-2.5 text-sm font-semibold text-mist-50 ring-1 ring-white/12 backdrop-blur transition hover:bg-mist-50/20 active:scale-[0.98]"
      >
        <svg
          viewBox="0 0 24 24"
          class="h-4 w-4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v5M12 8h.01" stroke-linecap="round" />
        </svg>
        More info
      </a>
    </div>

    <p class="mt-5 text-[0.6875rem] text-mist-500">Source stream: {{ asset().sourceCredit }}</p>
  </div>
</section>
