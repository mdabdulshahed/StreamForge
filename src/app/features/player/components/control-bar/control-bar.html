<div class="bar" (pointerdown)="$event.stopPropagation()">
  <div class="scrubber">
    <input
      type="range"
      class="scrub-input"
      min="0"
      [max]="duration() || 0.1"
      step="0.05"
      [value]="currentTime()"
      [style.background]="trackBackground()"
      (input)="onScrub($event)"
      [attr.aria-label]="seekAriaLabel()"
    />
  </div>

  <div class="controls-row">
    <div class="controls-left">
      <button
        type="button"
        class="ctrl-btn primary"
        (click)="playPauseToggle.emit()"
        [attr.aria-label]="isPlaying() ? 'Pause' : 'Play'"
      >
        @if (isBuffering()) {
          <span class="spinner" aria-hidden="true"></span>
        } @else if (isPlaying()) {
          <svg viewBox="0 0 24 24" class="icon" fill="currentColor" aria-hidden="true">
            <path d="M7 5h4v14H7zM13 5h4v14h-4z" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" class="icon" fill="currentColor" aria-hidden="true">
            <path
              d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14Z"
            />
          </svg>
        }
      </button>

      <div class="volume-group">
        <button
          type="button"
          class="ctrl-btn"
          (click)="muteToggle.emit()"
          [attr.aria-label]="muted() ? 'Unmute' : 'Mute'"
        >
          @switch (volumeIcon()) {
            @case ('muted') {
              <svg viewBox="0 0 24 24" class="icon" fill="currentColor" aria-hidden="true">
                <path
                  d="M4 9v6h4l5 5V4L8 9H4Zm11.5 3-2.5 2.5V6.5L15.5 9l2 2-2 2 2 2-2 2-2-2Z"
                />
              </svg>
            }
            @case ('low') {
              <svg viewBox="0 0 24 24" class="icon" fill="currentColor" aria-hidden="true">
                <path
                  d="M4 9v6h4l5 5V4L8 9H4Zm12.5 3a3.5 3.5 0 0 0-2-3.16v6.32A3.5 3.5 0 0 0 16.5 12Z"
                />
              </svg>
            }
            @default {
              <svg viewBox="0 0 24 24" class="icon" fill="currentColor" aria-hidden="true">
                <path
                  d="M4 9v6h4l5 5V4L8 9H4Zm12.5 3a4.5 4.5 0 0 0-3-4.24v8.48A4.5 4.5 0 0 0 16.5 12ZM13.5 2.76v2.06A7.5 7.5 0 0 1 19 12a7.5 7.5 0 0 1-5.5 7.18v2.06A9.5 9.5 0 0 0 21 12a9.5 9.5 0 0 0-7.5-9.24Z"
                />
              </svg>
            }
          }
        </button>
        <input
          type="range"
          class="volume-input"
          min="0"
          max="1"
          step="0.05"
          [value]="muted() ? 0 : volume()"
          (input)="onVolumeInput($event)"
          aria-label="Volume"
        />
      </div>

      <span class="time" aria-hidden="true">
        {{ currentTime() | duration: 'clock' }} / {{ duration() | duration: 'clock' }}
      </span>
    </div>

    <div class="controls-right">
      <label class="rate-select">
        <span class="sr-only">Playback speed</span>
        <select [value]="playbackRate()" (change)="onRateChange($event)" aria-label="Playback speed">
          @for (rate of rateOptions; track rate) {
            <option [value]="rate">{{ rate }}×</option>
          }
        </select>
      </label>

      <button
        type="button"
        class="ctrl-btn"
        [class.is-active]="captionsOn()"
        [disabled]="!hasCaptions()"
        [attr.aria-disabled]="!hasCaptions() || null"
        [attr.aria-pressed]="hasCaptions() ? captionsOn() : null"
        [attr.title]="captionsLabel()"
        [attr.aria-label]="captionsLabel()"
        (click)="captionToggle.emit()"
      >
        <svg
          viewBox="0 0 24 24"
          class="icon"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M7 13h3M14 13h3M7 10h6" stroke-linecap="round" />
        </svg>
      </button>

      <div class="quality-menu-wrap">
        <button
          type="button"
          class="ctrl-btn"
          [class.is-active]="qualityMenuOpen()"
          [disabled]="qualityOptions().length === 0"
          [attr.aria-disabled]="qualityOptions().length === 0 || null"
          aria-haspopup="menu"
          [attr.aria-expanded]="qualityMenuOpen()"
          [attr.title]="qualityButtonLabel()"
          [attr.aria-label]="qualityButtonLabel()"
          (click)="toggleQualityMenu()"
        >
          <svg
            viewBox="0 0 24 24"
            class="icon"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
            />
          </svg>
        </button>

        @if (qualityMenuOpen()) {
          <div class="menu-backdrop" (click)="qualityMenuOpen.set(false)"></div>
          <ul
            class="quality-popover"
            role="menu"
            aria-label="Quality"
            (keydown.escape)="qualityMenuOpen.set(false)"
          >
            <li role="none">
              <button
                type="button"
                role="menuitemradio"
                class="quality-option"
                [class.is-selected]="abrEnabled()"
                [attr.aria-checked]="abrEnabled()"
                (click)="chooseAuto()"
              >
                <span>{{ autoOptionLabel() }}</span>
                @if (abrEnabled()) {
                  <svg viewBox="0 0 24 24" class="check" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                    <path d="M5 12l4 4L19 6" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                }
              </button>
            </li>
            @for (option of qualityOptions(); track option.id) {
              <li role="none">
                <button
                  type="button"
                  role="menuitemradio"
                  class="quality-option"
                  [class.is-selected]="isQualitySelected(option)"
                  [attr.aria-checked]="isQualitySelected(option)"
                  (click)="chooseQuality(option)"
                >
                  <span>{{ option.label }}</span>
                  @if (isQualitySelected(option)) {
                    <svg viewBox="0 0 24 24" class="check" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                      <path d="M5 12l4 4L19 6" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                  }
                </button>
              </li>
            }
          </ul>
        }
      </div>

      <button
        type="button"
        class="ctrl-btn"
        (click)="fullscreenToggle.emit()"
        [attr.aria-label]="isFullscreen() ? 'Exit fullscreen' : 'Enter fullscreen'"
      >
        @if (isFullscreen()) {
          <svg
            viewBox="0 0 24 24"
            class="icon"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              d="M9 3v4a2 2 0 0 1-2 2H3M21 9h-4a2 2 0 0 1-2-2V3M3 15h4a2 2 0 0 1 2 2v4M15 21v-4a2 2 0 0 1 2-2h4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            class="icon"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              d="M3 9V5a2 2 0 0 1 2-2h4M21 9V5a2 2 0 0 0-2-2h-4M3 15v4a2 2 0 0 0 2 2h4M21 15v4a2 2 0 0 1-2 2h-4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        }
      </button>
    </div>
  </div>
</div>
