<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StreamForge — Adaptive Video Streaming</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="StreamForge is a browser-based adaptive streaming platform demonstrating HLS and MPEG-DASH playback, Media Source Extensions, ABR behaviour and playback diagnostics."
    />
    <meta name="theme-color" content="#07080b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Optional webfont. The design falls back to the system stack if this
         fails to load, so the app stays usable offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
